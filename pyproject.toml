[project]
name = "agentic-rag-policy-assistant"
version = "1.0.0"
description = "Two-agent RAG (Data Retriever -> Report Generator) built with LangGraph."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
